
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Absensi QR Pangjajap 2026</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f5f4;
      margin: 0;
      padding: 20px;
      color: #202520;
    }
    main {
      max-width: 480px;
      margin: auto;
      padding: 20px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 3px 15px #0001;
    }
    button {
      width: 100%;
      border: 0;
      border-radius: 9px;
      padding: 13px;
      margin-top: 12px;
      background: #176b45;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }
    #status {
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      background: #eef1ef;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
<main>
  <h2>Absensi QR Mahasiswa</h2>
  <p>Pangjajap 2026 · PJP2026</p>

  <div id="reader"></div>
  <button id="start">Aktifkan Kamera</button>
  <button id="reset">Scan Berikutnya</button>
  <div id="status">Scanner belum diaktifkan.</div>
</main>

<script>
  const SUPABASE_URL =
    "https://lhvamrfhnfuubdptouxc.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_N8sI5hzMuW61-BGXG8ICLw_nePG-Wau";

  const EVENT_ID = "PJP2026";

  const statusBox = document.getElementById("status");
  const startButton = document.getElementById("start");
  const resetButton = document.getElementById("reset");

  let scanner = null;
  let busy = false;

  async function stopScanner() {
    if (scanner && scanner.isScanning) {
      try {
        await scanner.stop();
      } catch (_) {}
    }
  }

  async function sendAttendance(qrText) {
    statusBox.textContent = "QR terbaca. Menyimpan absensi...";
    startButton.disabled = true;
    resetButton.disabled = true;

    try {
      const response = await fetch(
        `${SUPABASE_URL}/rest/v1/rpc/scan_absensi`,
        {
          method: "POST",
          headers: {
            "apikey": SUPABASE_KEY,
            "Authorization": `Bearer ${SUPABASE_KEY}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            p_kode_qr: qrText,
            p_id_acara: EVENT_ID
          })
        }
      );

      const result = await response.json();

      if (!response.ok) {
        throw new Error(
          result.message || result.details ||
          `HTTP ${response.status}`
        );
      }

      const data = Array.isArray(result) ? result[0] : result;

      if (data && data.ok) {
        statusBox.textContent =
          data.message || "Absensi berhasil dicatat.";
      } else {
        statusBox.textContent =
          "Absensi gagal: " +
          (data?.message || "QR tidak dikenali atau terjadi kesalahan.");
      }
    } catch (error) {
      statusBox.textContent =
        "Gagal mengirim absensi. " + error.message;
    } finally {
      startButton.disabled = false;
      resetButton.disabled = false;
    }
  }

  startButton.onclick = async () => {
    if (busy) return;

    try {
      startButton.disabled = true;
      resetButton.disabled = true;

      await stopScanner();
      scanner = new Html5Qrcode("reader");

      await scanner.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 230, height: 230 } },
        async (text) => {
          if (busy) return;

          busy = true;
          await stopScanner();
          await sendAttendance(text);
        },
        () => {}
      );

      statusBox.textContent =
        "Kamera aktif. Arahkan ke QR mahasiswa.";
    } catch (error) {
      statusBox.textContent =
        "Kamera gagal dibuka: " + error.message;
      startButton.disabled = false;
      resetButton.disabled = false;
    }
  };

  resetButton.onclick = async () => {
    await stopScanner();
    busy = false;
    startButton.disabled = false;
    resetButton.disabled = false;
    statusBox.textContent =
      "Tekan Aktifkan Kamera untuk scan berikutnya.";
  };
</script>
</body>
</html>
