
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Absensi QR Pangjajap 2026</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f5f4;
      margin: 0;
      padding: 20px;
      color: #202520;
    }
    main {
      max-width: 480px;
      margin: auto;
      padding: 20px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 3px 15px #0001;
    }
    button {
      width: 100%;
      border: 0;
      border-radius: 9px;
      padding: 13px;
      margin-top: 12px;
      background: #176b45;
      color: white;
      font-size: 16px;
    }
    button:disabled {
      opacity: 0.6;
    }
    #status {
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      background: #eef1ef;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
<main>
  <h2>Absensi QR Mahasiswa</h2>
  <p>Pangjajap 2026 · PJP2026</p>
  <div id="reader"></div>
  <button id="start">Aktifkan Kamera</button>
  <button id="reset">Scan Berikutnya</button>
  <div id="status">Scanner belum diaktifkan.</div>
</main>

<script>
  const API_URL = "https://script.google.com/a/macros/student.unsil.ac.id/s/AKfycbxrMVz-Ktoj5-xdpocuOfiMjXk7CaqN3YPcvkdM7-F0J1_Vq5ZOMP6PtQRSfvui6xk7lg/exec";
  const EVENT_ID = "PJP2026";

  const statusBox = document.getElementById("status");
  const startButton = document.getElementById("start");
  let scanner;
  let busy = false;

  startButton.onclick = async () => {
    try {
      if (scanner) {
        try {
          await scanner.stop();
        } catch (_) {}
      }

      scanner = new Html5Qrcode("reader");
      startButton.disabled = true;

      await scanner.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 230, height: 230 } },
        async text => {
          if (busy) return;
          busy = true;

          try {
            await scanner.stop();
          } catch (_) {}

          statusBox.textContent = "QR terbaca. Mengirim absensi...";

          try {
            await fetch(API_URL, {
              method: "POST",
              mode: "no-cors",
              headers: {
                "Content-Type": "text/plain;charset=utf-8"
              },
              body: JSON.stringify({
                kodeQR: text,
                eventId: EVENT_ID
              })
            });

            statusBox.textContent =
              "Permintaan dikirim. Periksa sheet LOG ABSENSI untuk memastikan data masuk.";
          } catch (error) {
            statusBox.textContent =
              "Pengiriman gagal: " + error.message;
          }

          startButton.disabled = false;
        },
        () => {}
      );

      statusBox.textContent =
        "Kamera aktif. Arahkan ke QR mahasiswa.";
    } catch (error) {
      statusBox.textContent =
        "Kamera gagal dibuka: " + error.message;
      startButton.disabled = false;
    }
  };

  document.getElementById("reset").onclick = async () => {
    busy = false;
    startButton.disabled = false;
    statusBox.textContent =
      "Tekan Aktifkan Kamera untuk scan berikutnya.";
  };
</script>
</body>
</html>
