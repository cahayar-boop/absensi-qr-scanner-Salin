
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Absensi QR Pangjajap 2026</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f5f4;
      margin: 0;
      padding: 20px;
      color: #202520;
    }

    main {
      max-width: 480px;
      margin: auto;
      padding: 20px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 3px 15px #0001;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 9px;
      padding: 13px;
      margin-top: 12px;
      background: #176b45;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #status {
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      background: #eef1ef;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
<main>
  <h2>Absensi QR Mahasiswa</h2>
  <p>Pangjajap 2026 · PJP2026</p>

  <div id="reader"></div>
  <button id="start">Aktifkan Kamera</button>
  <button id="reset">Scan Berikutnya</button>
  <div id="status">Scanner belum diaktifkan.</div>
</main>

<script>
  const API_URL =
    "https://script.google.com/a/macros/student.unsil.ac.id/s/AKfycbxrMVz-Ktoj5-xdpocuOfiMjXk7CaqN3YPcvkdM7-F0J1_Vq5ZOMP6PtQRSfvui6xk7lg/exec";

  const EVENT_ID = "PJP2026";

  const statusBox = document.getElementById("status");
  const startButton = document.getElementById("start");
  const resetButton = document.getElementById("reset");

  let scanner = null;
  let busy = false;

  async function stopScanner() {
    if (scanner) {
      try {
        if (scanner.isScanning) {
          await scanner.stop();
        }
      } catch (_) {}
    }
  }

  async function sendAttendance(qrText) {
    statusBox.textContent = "QR terbaca. Mengirim absensi...";

    try {
      const response = await fetch(API_URL, {
        method: "POST",
        headers: {
          "Content-Type": "text/plain;charset=utf-8"
        },
        body: JSON.stringify({
          kodeQR: qrText,
          eventId: EVENT_ID
        }),
        redirect: "follow"
      });

      if (!response.ok) {
        throw new Error("Server merespons HTTP " + response.status);
      }

      const result = await response.json();

      if (result.ok) {
        statusBox.textContent = result.message;
      } else {
        statusBox.textContent =
          "Absensi gagal: " + (result.message || "Kesalahan server.");
      }
    } catch (error) {
      statusBox.textContent =
        "Belum dapat memastikan absensi tersimpan. " +
        "Koneksi ditolak atau respons server tidak dapat dibaca. " +
        "Detail: " + error.message;
    } finally {
      startButton.disabled = false;
      resetButton.disabled = false;
    }
  }

  startButton.onclick = async () => {
    if (busy) return;

    try {
      await stopScanner();

      scanner = new Html5Qrcode("reader");
      startButton.disabled = true;
      resetButton.disabled = true;

      await scanner.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 230, height: 230 } },
        async (text) => {
          if (busy) return;

          busy = true;
          startButton.disabled = true;
          resetButton.disabled = true;

          await stopScanner();
          await sendAttendance(text);
        },
        () => {}
      );

      statusBox.textContent =
        "Kamera aktif. Arahkan ke QR mahasiswa.";
      startButton.disabled = false;
      resetButton.disabled = false;
    } catch (error) {
      statusBox.textContent =
        "Kamera gagal dibuka: " + error.message;
      startButton.disabled = false;
      resetButton.disabled = false;
    }
  };

  resetButton.onclick = async () => {
    await stopScanner();
    busy = false;
    startButton.disabled = false;
    resetButton.disabled = false;
    statusBox.textContent =
      "Tekan Aktifkan Kamera untuk scan berikutnya.";
  };
</script>
</body>
</html>
