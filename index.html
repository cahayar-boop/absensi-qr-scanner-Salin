
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Absensi QR Pangjajap 2026</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f5f4;
      margin: 0;
      padding: 20px;
      color: #202520;
    }
    main {
      max-width: 480px;
      margin: auto;
      padding: 20px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 3px 15px #0001;
    }
    button {
      width: 100%;
      border: 0;
      border-radius: 9px;
      padding: 13px;
      margin-top: 12px;
      background: #176b45;
      color: white;
      font-size: 16px;
    }
    #status {
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      background: #eef1ef;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
<main>
  <h2>Absensi QR Mahasiswa</h2>
  <p>Pangjajap 2026 · PJP2026</p>
  <div id="reader"></div>
  <button id="start">Aktifkan Kamera</button>
  <button id="reset">Scan Berikutnya</button>
  <div id="status">Scanner belum diaktifkan.</div>
</main>

<script>
  const statusBox = document.getElementById("status");
  let scanner;
  let busy = false;

  document.getElementById("start").onclick = async () => {
    try {
      scanner = new Html5Qrcode("reader");
      await scanner.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 230, height: 230 } },
        async text => {
          if (busy) return;
          busy = true;
          statusBox.textContent =
            "QR terbaca: " + text +
            ". Pengiriman absensi belum diaktifkan.";
          try {
            await scanner.stop();
          } catch (_) {}
        },
        () => {}
      );
      statusBox.textContent =
        "Kamera aktif. Arahkan ke QR mahasiswa.";
    } catch (e) {
      statusBox.textContent = "Kamera gagal dibuka: " + e.message;
    }
  };

  document.getElementById("reset").onclick = () => {
    busy = false;
    statusBox.textContent =
      "Tekan Aktifkan Kamera untuk memulai scan berikutnya.";
  };
</script>
</body>
</html>
